# Tooling configuration only; the project is not packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["gude_exporter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit (security),
# SIM: simplifications, C4: comprehensions
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional (container default)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]  # assert / dummy credentials in tests
"gude_exporter/__main__.py" = ["E501"]  # embedded HTML/CSS on the index page
